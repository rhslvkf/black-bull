<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      Pretendard 실제 로딩. index.css는 'Pretendard'를 1순위로 선언하지만 @font-face가
      없으면 조용히 시스템 폰트로 떨어진다(Task 9 이전 상태). CDN 스타일시트가 굵기별
      @font-face를 이미 포함하므로 여기서는 로딩만 걸면 된다.
      로딩이 실패해도(오프라인·CDN 차단) index.css의 폴백 스택
      (system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif)이
      화면을 지켜준다 — 화면이 무너지지 않는다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <title>흑우키우기</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
